# Compile la version web (C++ -> WebAssembly) et la publie sur GitHub Pages
# à chaque push sur main.
name: Publier la version web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # On ne publie jamais une version dont les tests échouent.
      - name: Tester le cœur
        run: sh tests/run.sh

      - name: Installer Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74

      - name: Compiler en WebAssembly
        run: sh web/build.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
